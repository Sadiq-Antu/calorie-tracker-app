name: Build & Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Optional commit SHA or tag to deploy/rollback to (defaults to latest main)'
        required: false
        default: ''

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Test, Build & Publish to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Latest main or requested commit SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Production PWA Bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATOR: 'false'
        run: npm run build

      - name: Deploy Hosting, Firestore Rules & Indexes to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project nutripulse-tracker-antu --token "$FIREBASE_TOKEN" --non-interactive
